# ============================================================================
# MamaHQ — CI (Step 5C)
# ============================================================================
# A verification pipeline (NOT deployment automation). Two jobs:
#
#   verify   — deterministic application checks that need no database:
#              catalog validation, Grocery Search/Resolver/Action tests,
#              TypeScript, lint, production build.
#
#   database — provisions a DISPOSABLE local Supabase stack on the runner
#              (GitHub's Ubuntu runners include Docker), applies the
#              authoritative migrations from an empty database via
#              `supabase db reset` (the clean-provision proof), then runs the
#              JWT-authenticated RLS/security suite and the completion/restore/
#              increment suite against it.
#
# PRODUCTION SAFETY: the database job uses ONLY the keys generated by the local
# Supabase stack (printed by `supabase status`). It never receives — and must
# never be given — the production management token or service-role key. There is
# no production connection anywhere in this workflow.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Deterministic checks — no database required.
  # --------------------------------------------------------------------------
  verify:
    name: Verify (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Catalog validation
        run: pnpm run catalog:validate

      - name: Grocery Search tests
        run: pnpm run test:grocery-search

      - name: Grocery Resolver tests
        run: pnpm run test:grocery-resolver

      - name: Grocery Action tests
        run: pnpm run test:grocery-actions

      - name: TypeScript
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build
        env:
          # Build must not require live secrets. Provide harmless placeholders so
          # any `NEXT_PUBLIC_*` reads at build time resolve to a syntactically
          # valid (but non-functional) value. These are NOT real credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # --------------------------------------------------------------------------
  # Database + security checks — disposable local Supabase (Docker on runner).
  # --------------------------------------------------------------------------
  database:
    name: Database & Security (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (Docker)
        run: supabase start

      - name: Clean-provision from authoritative migrations (empty DB -> 0001..0007)
        # `db reset` drops the local db and replays every file in supabase/migrations
        # in order. This IS the clean-provision proof: it fails if any migration
        # cannot apply from scratch.
        run: supabase db reset

      - name: Export local Supabase credentials (local-only, never production)
        # Use --override-name so the CLI emits exactly the variable names our test
        # harness expects. These are the throwaway local stack's keys, printed by
        # the CLI; they are NOT production credentials.
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(SUPABASE_URL|SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' >> "$GITHUB_ENV"

      - name: Seed the global catalog projection (service role, local)
        # Some catalog security assertions read canonical_items; seed so the
        # projection matches the source-of-truth files. Local DB only.
        run: node scripts/seed-catalog.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Completion / restore / increment tests
        run: node scripts/test-db-completion.ts

      - name: RLS / security / RPC-authorization tests
        run: node scripts/test-security.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop || true
